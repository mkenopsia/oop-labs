<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиццерия</title>
    <link rel="stylesheet" href="../commonstyles.css">
</head>
<body>
    <div class="header">
        <h1><a href="../mainpage/mainpage.html">Меню пиццерии</a></h1>
        <h1><a href="../adminpanel/adminpanel.html">Менеджмент</a></h1>
        <h1><a href="../cart/cart.html">Корзина</a></h1>
    </div>

    <div class="search-filter-container">
        <input id="filter" class="filter-input" placeholder="Отфильровать по ингредиентам">
        <button id="do-filter">Отфильтровать</button>
    </div>

    <section class="custom-options">

        <div class="AB-pizza">
            <div class="pizza-card">
                <h3>Создайте A|B пиццу</h3>
                <button id="add-AB-pizza">Создать</button>
            </div>
        </div>
        
        <div class="custom-pizza">
            <div class="pizza-card">
                <h3>Создайте свою пиццу</h3>
                <button id="add-custom-pizza">Создать</button>
            </div>
        </div>

    </section>
    <div id="pizzas-container"></div>
    <div id="error-message" class="error-message" style="display: none;"></div>

    <div id="modal-window" class="modal" value="30см">
        <select name="pizza-sizes" id="size-input">
            <option value="30см">По умолчанию - 30см</option>
            <option value="25см">25см</option>
            <option value="35см">35см</option>
        </select>
        <select id="board-input">
        </select>
        <ul id="multiply-ingredient-list" style="max-height: 300px; overflow-y: auto;"></ul>
        <button id="add-pizza-to-cart">Добавить в корзину</button>
    </div>

    <div id="modal-window-AB-pizza" class="modal">
        <h3 class="modal-text">Соберите пиццу из двух половинок</h3>
        <label>Пицца A</label>
        <select id="pizza-A">
        </select>
        <label>Пицца B</label>
        <select id="pizza-B">
        </select>
        <label>Бортик</label>
        <select id="AB-pizza-board">
        </select>
        <label>Размер</label>
        <select id="AB-pizza-size-input">
            <option value="30см">По умолчанию - 30см</option>
            <option value="25см">25см</option>
            <option value="35см">35см</option>
        </select>
        <button id="add-AB-pizza-to-cart">Добавить в корзину</button>
    </div>

    <div id="modal-window-custom-pizza" class="modal">
        <h3 class="modal-text">Введите название Вашей пиццы</h3>
        <input id="custom-pizza-name">
        <ul id="ingredient-list" style="max-height: 300px; overflow-y: auto;"></ul>
        <label>Бортик</label>
        <select id="custom-pizza-board">
        </select>
        <label>Основа</label>
        <select id="custom-pizza-base">
        </select>
        <label>Размер</label>
        <select id="custom-pizza-size-input">
            <option value="30см">По умолчанию - 30см</option>
            <option value="25см">25см</option>
            <option value="35см">35см</option>
        </select>
        <button id="add-custom-pizza-to-cart">Добавить в корзину</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
